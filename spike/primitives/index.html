{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------- palette
const C = {
  ink: '#3a2f2a', paper: '#f2ede3',
  grass: '#b9dc94', grassSide: '#a3cf80', dirt: '#dcc39c', dirtDark: '#c7a982',
  path: '#f3e8d0', plaza: '#ece3d1',
  sea: '#a7d1f0', seaDeep: '#8fc0ea', seaSide: '#86b6e0', foam: '#f4fbff', shallow: '#c3e3f6',
  stone: '#f4eee3', stoneShade: '#dfd5c5',
  wood: '#c99764', white: '#fdfaf3', glass: '#7b96cf',
  roof: ['#e47a66', '#6d8ccf', '#eaa65c', '#7cbf9b', '#9a92b8'],
  wall: ['#f6d77c', '#c6b5e6', '#f5b0a6', '#b0dcc6', '#aacdee', '#faf3e6'],
  leaf: '#9bcd76', leafDark: '#6fab62', bush: '#88c26b', trunk: '#9a6b4a',
  brick: '#d98a6c', redDark: '#bb5a4d', red: '#e56b58', yellow: '#ffd96e', pink: '#f4a3bf',
  skin: ['#f3cfb0', '#d9a27c', '#a8714e', '#7a4d33'],
  shirt: ['#e86a5c', '#5f86d6', '#f2c14e', '#6cbf8e', '#b28ad9', '#ffffff', '#f49ab8'],
  hair: ['#3b2a22', '#6b4a2f', '#e2b25c', '#2c2c38', '#a0522d'],
  pants: '#4c4862', magic: '#c6b2ff', magicInk: '#6a4fd0', metal: '#4b4a55',
  marble: '#f8f5ef',
};
const FLOWERS = [C.red, C.pink, C.yellow, C.white, '#b48ce0'];
const H = 0.8;   // one storey: every vertical piece is a multiple of this
const G = 0.3;   // island top (ground level)

// tiny seeded RNG so every prop is deterministic
function rng(seed) { let a = (seed * 9301 + 49297) | 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------- materials
// Flat "illustration" shading: 3-4 stepped tones from a fixed light, no real lights.
// Optional procedural "pencil" patterns (grass ticks, roof rows, stone courses...) in world space.
const LIGHT = new THREE.Vector3(0.35, 1, 0.6).normalize();
const shadeVert = `
attribute float aEdge;
varying vec3 vN; varying vec3 vW; varying float vEdge;
void main(){
  vec4 w = modelMatrix * vec4(position, 1.0);
  vW = w.xyz; vEdge = aEdge;
  vN = normalize(mat3(transpose(inverse(modelMatrix))) * normal);
  gl_Position = projectionMatrix * viewMatrix * w;
}`;
const shadeFrag = `
uniform vec3 uColor; uniform vec3 uLight; uniform float uEmissive; uniform int uPat; uniform vec3 uInk;
varying vec3 vN; varying vec3 vW; varying float vEdge;
float h(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
float lineAA(float d, float w){ float fw = fwidth(d) * 1.2; return 1.0 - smoothstep(w - fw, w + fw, d); }
void main(){
  vec3 n = normalize(vN);
  float d = dot(n, uLight);
  float s = d > 0.75 ? 1.0 : (d > 0.35 ? 0.9 : (d > -0.1 ? 0.79 : 0.71));
  s = mix(s, 1.0, uEmissive);
  float k = 1.0 - s;
  // shadows drift slightly cool/violet rather than just darker: reads as paint, not plastic
  vec3 col = uColor * s * mix(vec3(1.0), vec3(0.93, 0.92, 1.06), k * 3.0);
  float pen = 0.0;   // amount of pencil-ink mark
  if (uPat == 1 && n.y > 0.9) {            // grass: sparse little tick strokes
    vec2 p = vW.xz * 3.6; vec2 c = floor(p); vec2 f = fract(p) - 0.5;
    float r = h(c);
    f -= (vec2(h(c + 3.1), h(c + 7.7)) - 0.5) * 0.5;
    vec2 dir = normalize(vec2(1.0, -1.0) + (r - 0.5) * 0.8);
    float t = clamp(dot(f, dir), -0.11, 0.11);
    float m = lineAA(length(f - dir * t), 0.03) * step(0.45, r);
    col = mix(col, col * vec3(0.72, 0.84, 0.68), m);
  } else if (uPat == 2 && n.y > 0.2 && n.y < 0.98) {   // roof: shingle rows
    float y = vW.y * 11.0;
    pen = lineAA(abs(fract(y) - 0.5), 0.05) * 0.22;
    float row = floor(y);
    float x = (vW.x + vW.z) * 6.0 + row * 0.5;
    pen += lineAA(abs(fract(x) - 0.5), 0.03) * (1.0 - step(0.35, fract(y))) * 0.14;
  } else if (uPat == 3 && abs(n.y) < 0.5) {  // slab side: earthy speckles + strata
    vec2 p = vec2(vW.x + vW.z, vW.y) * vec2(5.0, 7.0); vec2 c = floor(p); vec2 f = fract(p) - 0.5;
    float r = h(c);
    pen = lineAA(length(f - (vec2(h(c + 2.0), h(c + 9.0)) - 0.5) * 0.6), 0.07) * step(0.62, r) * 0.35;
    pen += lineAA(abs(fract(vW.y * 2.2 + sin((vW.x + vW.z) * 1.3) * 0.08) - 0.5), 0.012) * 0.25;
  } else if (uPat == 4) {                     // stone courses
    float y = vW.y * 6.0; float row = floor(y);
    float along = (abs(n.x) > abs(n.z)) ? vW.z : vW.x;
    if (abs(n.y) > 0.5) along = vW.x + vW.z;
    float x = along * 3.2 + row * 0.5;
    float m = lineAA(abs(fract(y) - 0.5), 0.04);
    if (abs(n.y) < 0.5) m = max(m, lineAA(abs(fract(x) - 0.5), 0.025));
    pen = m * 0.22;
  } else if (uPat == 5 && n.y > 0.9) {      // plaza: one paving tile per grid cell (shows the build grid)
    vec2 f = abs(fract(vW.xz) - 0.5);
    pen = lineAA(0.5 - max(f.x, f.y), 0.012) * 0.28;
    vec2 g = abs(fract(vW.xz * 2.0) - 0.5);
    pen += lineAA(0.5 - max(g.x, g.y), 0.008) * 0.08;
  } else if (uPat == 6 && n.y > 0.9) {      // wood planks
    pen = lineAA(abs(fract(vW.z * 9.0) - 0.5), 0.05) * 0.25;
  } else if (uPat == 8) {                    // marble: soft tone drift, faint veins, bevel at the mass's top edge
    vec2 p = abs(n.y) > 0.5 ? vW.xz : (abs(n.x) > abs(n.z) ? vec2(vW.z, vW.y) : vec2(vW.x, vW.y));
    col *= 0.955 + 0.08 * n2(p * 0.8 + 7.0);                          // soft cloudy tone shifts
    float warp = n2(p * 1.3) * 1.8 + n2(p * 3.1) * 0.6;
    float v = abs(fract((p.x * 0.6 + p.y * 0.4) * 1.0 + warp) - 0.5);
    float fade = smoothstep(0.25, 0.7, n2(p * 0.6 + 3.0));
    col = mix(col, col * vec3(0.9, 0.9, 0.96), lineAA(v, 0.05) * fade * 0.5);   // vein halo
    col = mix(col, col * vec3(0.7, 0.72, 0.84), lineAA(v, 0.007) * fade * 0.8);  // vein core
    if (abs(n.y) < 0.5) {
      col = mix(col, uColor * 1.02, lineAA(abs(vEdge - 0.032), 0.032));  // lit bevel strip under the top edge
      pen = lineAA(abs(vEdge - 0.07), 0.006) * 0.5;                     // and the pencil line that defines it
    }
  } else if (uPat == 7) {                     // glass: a diagonal glint
    float g = fract((vW.x - vW.z) * 2.2 + vW.y * 2.6);
    col = mix(col, vec3(1.0), smoothstep(0.02, 0.0, abs(g - 0.35) - 0.06) * 0.45);
  }
  col = mix(col, uInk, pen);
  gl_FragColor = vec4(col, 1.0);
  #include <colorspace_fragment>
}`;
const INK = new THREE.Color(C.ink);
const matCache = new Map();
function makeMat(color, emissive = 0, pat = 0) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) }, uLight: { value: LIGHT }, uEmissive: { value: emissive },
      uPat: { value: pat }, uInk: { value: INK } },
    vertexShader: shadeVert, fragmentShader: shadeFrag,
  });
}
function mat(color, { emissive = 0, pat = 0 } = {}) {
  const key = color + '|' + emissive + '|' + pat;
  if (!matCache.has(key)) matCache.set(key, makeMat(color, emissive, pat));
  return matCache.get(key);
}
// ID + view-normal pass, used only to find where ink lines go.
const idVert = `varying vec3 vVN; void main(){ vVN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const idFrag = `uniform vec2 uId; varying vec3 vVN; void main(){ vec3 n = normalize(vVN); gl_FragColor = vec4(n.xy*0.5+0.5, uId); }`;

// ---------------------------------------------------------------- helpers
const scene = new THREE.Scene();
const geoCache = new Map();
const cached = (key, make) => { if (!geoCache.has(key)) geoCache.set(key, make()); return geoCache.get(key); };
function mesh(geo, color, x = 0, y = 0, z = 0, parent = scene, opts) {
  const mtl = Array.isArray(color) ? color.map((c, i) => mat(c, Array.isArray(opts) ? opts[i] : opts)) : mat(color, opts);
  const m = new THREE.Mesh(geo, mtl);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
// box with y = bottom
function boxB(w, h, d, color, x, y, z, parent, opts) {
  return mesh(cached(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d)), color, x, y + h / 2, z, parent, opts);
}
function cyl(rt, rb, h, seg, color, x, y, z, parent, opts) {
  return mesh(cached(`c${rt},${rb},${h},${seg}`, () => new THREE.CylinderGeometry(rt, rb, h, seg)), color, x, y + h / 2, z, parent, opts);
}
function sphere(r, color, x, y, z, parent, opts) {
  return mesh(cached(`s${r}`, () => new THREE.SphereGeometry(r, 18, 12)), color, x, y, z, parent, opts);
}
function group(parent, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
const pick = (arr, i) => arr[((i % arr.length) + arr.length) % arr.length];
const FACE_ROT = [0, Math.PI / 2, Math.PI, -Math.PI / 2]; // +z, +x, -z, -x

// ---------------------------------------------------------------- primitives
function windowOn(parent, x, y, z, rnd) {
  const g = group(parent, x, y, z);
  boxB(0.22, 0.31, 0.03, C.white, 0, 0, 0, g);                       // frame
  boxB(0.16, 0.25, 0.034, C.glass, 0, 0.03, 0, g, { pat: 7 });         // glass
  boxB(0.018, 0.25, 0.042, C.white, 0, 0.03, 0, g);                    // mullion
  boxB(0.16, 0.018, 0.046, C.white, 0, 0.16, 0, g);                    // transom
  boxB(0.27, 0.03, 0.08, C.white, 0, -0.02, 0.01, g);                  // sill
  if (rnd && rnd() < 0.35) {                                          // window box with flowers
    boxB(0.22, 0.05, 0.07, C.wood, 0, -0.07, 0.05, g);
    for (let i = 0; i < 3; i++) sphere(0.032, pick(FLOWERS, Math.floor(rnd() * 5)), -0.07 + i * 0.07, -0.01, 0.06, g);
  }
  return g;
}
function doorOn(parent, x, y, z, color) {
  const g = group(parent, x, y, z);
  boxB(0.28, 0.45, 0.03, C.white, 0, 0, 0, g);
  boxB(0.21, 0.4, 0.04, color, 0, 0, 0, g);
  sphere(0.016, C.yellow, 0.06, 0.2, 0.025, g);
  boxB(0.36, 0.045, 0.16, C.stoneShade, 0, 0, 0.06, g);
  return g;
}
function roundWindow(parent, x, y, z) {
  const g = group(parent, x, y, z); g.rotation.x = Math.PI / 2;
  cyl(0.085, 0.085, 0.03, 16, C.white, 0, -0.015, 0, g);
  cyl(0.058, 0.058, 0.034, 16, C.glass, 0, -0.017, 0, g, { pat: 7 });
  return g;
}
const smokeEmitters = [];
function house({ wall = C.wall[0], roof = C.roof[0], floors = 1, hasRoof = true, door = C.redDark, seed = 0, chimney = true } = {}) {
  const g = new THREE.Group();
  const rnd = rng(seed + 11);
  boxB(0.92, 0.07, 0.92, C.stoneShade, 0, 0, 0, g);                   // plinth
  for (let f = 0; f < floors; f++) {
    const y0 = f * H;
    boxB(0.86, H, 0.86, wall, 0, y0, 0, g);
    boxB(0.92, 0.05, 0.92, C.white, 0, y0 + H - 0.05, 0, g);           // floor trim
    for (let k = 0; k < 4; k++) {
      const face = group(g); face.rotation.y = FACE_ROT[k];
      if (f === 0 && k === 0) {
        doorOn(face, -0.17, y0 + 0.05, 0.43, door);
        windowOn(face, 0.19, y0 + 0.3, 0.43, rnd);
      } else {
        windowOn(face, -0.19, y0 + 0.27, 0.43, rnd);
        windowOn(face, 0.19, y0 + 0.27, 0.43, rnd);
      }
    }
  }
  const top = floors * H;
  if (hasRoof) {
    const rg = cached('roof', () => {
      const s = new THREE.Shape();
      s.moveTo(-0.55, 0); s.lineTo(0.55, 0); s.lineTo(0, 0.46); s.closePath();
      const geo = new THREE.ExtrudeGeometry(s, { depth: 1.0, bevelEnabled: false });
      geo.translate(0, 0, -0.5); return geo;
    });
    mesh(rg, [wall, roof], 0, top, 0, g, [{}, { pat: 2 }]);
    roundWindow(g, 0, top + 0.17, 0.5);
    if (chimney) {
      const ch = boxB(0.14, 0.4, 0.14, C.brick, 0.25, top + 0.06, -0.2, g, { pat: 4 });
      boxB(0.19, 0.05, 0.19, C.white, 0, 0.2, 0, ch);
      smokeEmitters.push({ obj: ch, offset: new THREE.Vector3(0, 0.3, 0), seed });
    }
  } else {
    // flat roof terrace: low parapet so something can stand on it
    boxB(0.92, 0.04, 0.92, C.stoneShade, 0, top, 0, g);
    for (let k = 0; k < 4; k++) {
      const face = group(g, 0, top + 0.04, 0); face.rotation.y = FACE_ROT[k];
      boxB(0.92, 0.09, 0.06, C.white, 0, 0, 0.43, face);
    }
  }
  return g;
}
function archGeo() {
  // a full cell-sized block with an arched passage (tunnel runs along z)
  return cached('arch', () => {
    const s = new THREE.Shape();
    const r = 0.27, spring = 0.36;
    s.moveTo(-0.5, 0); s.lineTo(-r, 0); s.lineTo(-r, spring);
    s.absarc(0, spring, r, Math.PI, 0, true);
    s.lineTo(r, 0); s.lineTo(0.5, 0); s.lineTo(0.5, H); s.lineTo(-0.5, H); s.closePath();
    const geo = new THREE.ExtrudeGeometry(s, { depth: 1.0, bevelEnabled: false, curveSegments: 16 });
    geo.translate(0, 0, -0.5); return geo;
  });
}
function stairs() {
  // 4 steps: rises one storey (H) over one cell, climbing toward -z
  const g = new THREE.Group();
  const n = 4;
  for (let i = 0; i < n; i++) {
    boxB(0.8, (i + 1) * H / n, 0.25, C.stone, 0, 0, 0.375 - i * 0.25, g, { pat: 4 });
    boxB(0.84, 0.03, 0.27, C.stoneShade, 0, (i + 1) * H / n - 0.026, 0.375 - i * 0.25, g); // step nosing (proud, avoids z-fight)
  }
  return g;
}
const swayers = [];
// procedural plants: one seed -> small variations of the same family (never clones)
function vary(base, r, amt = 1) {
  const c = new THREE.Color(base), hsl = {}; c.getHSL(hsl);
  c.setHSL(hsl.h + (r() - 0.5) * 0.05 * amt, Math.min(1, hsl.s * (0.9 + r() * 0.2)), hsl.l + (r() - 0.5) * 0.08 * amt);
  return '#' + c.getHexString();
}
const unitSphere = () => cached('unitSphere', () => new THREE.SphereGeometry(1, 18, 12));
function blob(r, color, x, y, z, parent) { const m = mesh(unitSphere(), color, x, y, z, parent); m.scale.setScalar(r); return m; }
function tree(seed = 0, s = 1) {
  const r = rng(seed * 31 + 7), g = new THREE.Group();
  const th = 0.26 + r() * 0.12, tr = +(0.045 + r() * 0.015).toFixed(3);
  const trunk = cyl(+(tr * 0.8).toFixed(3), tr, +th.toFixed(2), 8, vary(C.trunk, r, 0.6), 0, 0, 0, g);
  trunk.rotation.z = (r() - 0.5) * 0.12;
  const crown = group(g, 0, th - 0.05, 0);
  const col = vary(C.leaf, r), R0 = 0.23 + r() * 0.07;
  blob(R0, col, 0, R0 * 0.85, 0, crown);
  const extra = 1 + Math.floor(r() * 4), a0 = r() * 6.28;       // 2..5 blobs in total
  for (let j = 0; j < extra; j++) {
    const a = a0 + j * 6.28 / extra + (r() - 0.5) * 0.8, d = R0 * (0.5 + r() * 0.35), rr = R0 * (0.5 + r() * 0.28);
    blob(rr, col, Math.cos(a) * d, R0 * (0.45 + r() * 0.85), Math.sin(a) * d, crown);
  }
  g.scale.setScalar(s * (0.88 + r() * 0.24));
  swayers.push({ obj: crown, phase: seed * 1.7, amt: 0.03 + r() * 0.02 });
  return g;
}
function cypress(seed = 0, s = 1) {
  const r = rng(seed * 17 + 3), g = new THREE.Group();
  cyl(0.04, 0.05, 0.2, 6, C.trunk, 0, 0, 0, g);
  const c = group(g, 0, 0.12, 0), col = vary(C.leafDark, r);
  const hgt = 0.9 + r() * 0.4, rad = 0.15 + r() * 0.05;
  blob(1, col, 0, hgt * 0.5, 0, c).scale.set(rad, hgt * 0.5, rad);
  if (r() < 0.6) blob(1, col, (r() - 0.5) * 0.04, hgt * 0.9, 0, c).scale.set(rad * 0.62, hgt * 0.25, rad * 0.62);
  g.scale.setScalar(s);
  swayers.push({ obj: c, phase: seed * 2.3, amt: 0.02 + r() * 0.015 });
  return g;
}
function bush(seed = 0, s = 1) {
  const g = new THREE.Group(); const r = rng(seed * 11 + 1);
  const col = vary(C.bush, r, 0.8), n = 2 + Math.floor(r() * 3);
  blob(0.13 + r() * 0.04, col, 0, 0.1, 0, g);
  for (let j = 0; j < n - 1; j++) {
    const a = r() * 6.28, d = 0.1 + r() * 0.06, rr = 0.09 + r() * 0.04;
    blob(rr, col, Math.cos(a) * d, rr * 0.75, Math.sin(a) * d, g);
  }
  if (r() < 0.5) for (let i = 0; i < 3; i++) sphere(0.028, pick(FLOWERS, Math.floor(r() * 5)), (r() - 0.5) * 0.25, 0.17 + r() * 0.05, 0.08 + r() * 0.06, g);
  g.scale.setScalar(s);
  return g;
}
function plant(seed, s = 1) { const v = rng(seed * 3 + 101)(); return v < 0.5 ? tree(seed, s) : v < 0.78 ? cypress(seed, s) : bush(seed, s); }
function flowerBed(cols = 8, rows = 4, seed = 0) {
  const g = new THREE.Group(); const r = rng(seed);
  const w = cols * 0.11 + 0.08, d = rows * 0.12 + 0.08;
  boxB(w + 0.06, 0.07, d + 0.06, C.wood, 0, 0, 0, g);

    let n = 1; while (isT('house', c.i, c.l + n, c.k)) n++;
    const above = at(c.i, c.l + n, c.k);                              // roof only if nothing sits on top
    place(house({ wall: c.wall, roof: c.roof, door: c.door, seed: c.seed, floors: n, hasRoof: !above }), wx(c.i), wz(c.k), wy(c.l), c.rot || 0);
  },
  pillar(c) {
    if (isT('pillar', c.i, c.l - 1, c.k)) return;                   // a run of stacked pillars = ONE column
    let n = 1; while (isT('pillar', c.i, c.l + n, c.k)) n++;
    const x = wx(c.i), z = wz(c.k), y0 = wy(c.l), top = y0 + n * H;
    const trim = batch('pillarTrim', C.stoneShade), collar = batch('pillarCollar', C.stone);
    bBox(trim, 0.5, 0.1, 0.5, x, y0, z); bBox(collar, 0.42, 0.05, 0.42, x, y0 + 0.1, z);          // base: bottom cell only
    bBox(collar, 0.42, 0.05, 0.42, x, top - 0.12, z); bBox(trim, 0.5, 0.07, 0.5, x, top - 0.07, z); // capital: top cell only
    const len = +(n * H - 0.27).toFixed(3);
    pushGeo(batch('pillarShaft', C.stone), cached('shaft' + len, () => new THREE.CylinderGeometry(0.15, 0.15 + 0.012 * n + 0.008, len, 18, 1)), Mx(x, y0 + 0.15 + len / 2, z));
  },
  arch(c) {
    const x = wx(c.i), z = wz(c.k), y = wy(c.l);
    pushGeo(batch('arch', C.stone, { pat: 4 }), archGeo(), Mx(x, y, z));           // all arch bodies share one mesh
    for (const sz of [1, -1]) bBox(batch('keystone', C.stoneShade), 0.13, 0.15, 0.04, x, y + 0.56, z + sz * 0.5);
    if (isT('arch', c.i, c.l + 1, c.k)) return;                    // stacked: no cornice between tiers -> one viaduct
    const reach = (di) => at(c.i + di, c.l, c.k) ? 0.5 : 0.53;       // run the cornice through to neighbours
    const x0 = x - reach(-1), x1 = x + reach(1);
    bBox(batch('archCap', C.stoneShade), +(x1 - x0).toFixed(3), 0.06, 1.06, (x0 + x1) / 2, y + H - 0.055, z);
    if (!at(c.i, c.l + 1, c.k)) for (const sz of [1, -1])          // walkable top gets a continuous parapet
      bBox(batch('parapet', C.stone, { pat: 4 }), +(x1 - x0).toFixed(3), 0.1, 0.07, (x0 + x1) / 2, y + H + 0.005, z + sz * 0.49);
  },
  marble(c) {
    // voxel faces: only emit faces that border a non-marble cell, so a cluster is one seamless solid
    const b = batch('marble', C.marble, { pat: 8 });
    const x = wx(c.i), y = wy(c.l), z = wz(c.k), s = 0.5;
    const Mn = (di, dl, dk) => isT('marble', c.i + di, c.l + dl, c.k + dk);
    const topOpen = !Mn(0, 1, 0);
    if (topOpen) pushQuad(b, [[x - s, y + H, z - s], [x + s, y + H, z - s], [x + s, y + H, z + s], [x - s, y + H, z + s]], [0, 1, 0]);
    if (!Mn(0, -1, 0)) pushQuad(b, [[x - s, y, z - s], [x + s, y, z - s], [x + s, y, z + s], [x - s, y, z + s]], [0, -1, 0]);
    const eT = topOpen ? 0 : 9, eB = topOpen ? H : 9;                // aEdge = distance below an exposed top edge (bevel line)
    for (const [di, dk] of DIRS) {
      if (Mn(di, 0, dk)) continue;
      const fx = x + di * s, fz = z + dk * s, tx = dk ? s : 0, tz = di ? s : 0;
      pushQuad(b, [[fx - tx, y, fz - tz], [fx + tx, y, fz + tz], [fx + tx, y + H, fz + tz], [fx - tx, y + H, fz - tz]], [di, 0, dk], [eB, eB, eT, eT]);
    }
  },
  fence(c) {
    const x = wx(c.i), z = wz(c.k), y = wy(c.l);
    const real = DIRS.filter(([di, dk]) => isT('fence', c.i + di, c.l, c.k + dk));
    const L = real.length ? real : [[1, 0], [-1, 0]];                // a lone piece is a short E-W run
    const straight = L.length === 2 && L[0][0] === -L[1][0] && L[0][1] === -L[1][1];
    const pk = batch('picket', C.white), rail = batch('fenceRail', C.white), post = batch('fencePost', C.white);
    const picket = (px, pz, alongX) => {
      bBox(pk, alongX ? 0.07 : 0.04, 0.3, alongX ? 0.04 : 0.07, px, y, pz);
      pushGeo(pk, cached('fenceTip', () => new THREE.ConeGeometry(0.05, 0.07, 4)), Mx(px, y + 0.335, pz, alongX ? Math.PI / 4 : Math.PI / 4));
    };

    if (straight) picket(x, z, L[0][0] !== 0); else bigPost(x, z);    // corner / end / tee -> a proper post
    for (const [di, dk] of L) {

      for (const t of [0.2, 0.4]) picket(x + di * t, z + dk * t, di !== 0);

  },
  wall(c) {
    const x = wx(c.i), z = wz(c.k), y = wy(c.l);
    const real = DIRS.filter(([di, dk]) => isT('wall', c.i + di, c.l, c.k + dk));
    const L = real.length ? real : [[1, 0], [-1, 0]];
    const straight = L.length === 2 && L[0][0] === -L[1][0] && L[0][1] === -L[1][1];
    const body = batch('wallBody', C.stone, { pat: 4 }), cap = batch('wallCap', C.stoneShade), mer = batch('merlon', C.stone);

  stairs(c) { place(stairs(), wx(c.i), wz(c.k), wy(c.l), c.rot || 0); },
  prop(c) { const o = place(c.make(), wx(c.i) + (c.dx || 0), wz(c.k) + (c.dz || 0), wy(c.l), c.rot || 0); if (c.scale) o.scale.multiplyScalar(c.scale); },
};

// ---- paths / plaza: every ground cell goes into ONE merged mesh per type
function rrShape(x0, y0, x1, y1, r) {   // r = [bl, br, tr, tl]
  const s = new THREE.Shape();
  s.moveTo(x0 + r[0], y0); s.lineTo(x1 - r[1], y0); if (r[1]) s.quadraticCurveTo(x1, y0, x1, y0 + r[1]);
  s.lineTo(x1, y1 - r[2]); if (r[2]) s.quadraticCurveTo(x1, y1, x1 - r[2], y1);
  s.lineTo(x0 + r[3], y1); if (r[3]) s.quadraticCurveTo(x0, y1, x0, y1 - r[3]);
  s.lineTo(x0, y0 + r[0]); if (r[0]) s.quadraticCurveTo(x0, y0, x0 + r[0], y0);
  return s;
}
function buildGround() {
  const T = { path: { color: C.path, m: 0.13, r: 0.25, y: 0.004 }, plaza: { color: C.plaza, m: 0, r: 0, y: 0.008, pat: 5 } };
  for (const [key, type] of ground) {
    const [i, k] = key.split(',').map(Number), t = T[type];
    const b = batch('ground-' + type, t.color, { pat: t.pat || 0 });
    const x = wx(i), z = wz(k), y = G + t.y, a = 0.5 - t.m;
    const con = (di, dk) => { const o = ground.get((i + di) + ',' + (k + dk)); return type === 'plaza' ? o === 'plaza' : !!o; };
    const E = con(1, 0), W = con(-1, 0), S = con(0, 1), N = con(0, -1);
    const rad = (p, q) => (!p && !q) ? t.r : 0;                      // round outer corners only
    const geo = new THREE.ShapeGeometry(rrShape(-a, -a, a, a, [rad(W, S), rad(E, S), rad(E, N), rad(W, N)]), 6);
    geo.rotateX(-Math.PI / 2); pushGeo(b, geo, Mx(x, y, z));          // shape y = -z
    if (!t.m) continue;
    const up = [0, 1, 0];
    const rect = (x0, z0, x1, z1) => pushQuad(b, [[x + x0, y, z + z0], [x + x1, y, z + z0], [x + x1, y, z + z1], [x + x0, y, z + z1]], up);
    if (E) rect(a, -a, 0.5, a); if (W) rect(-0.5, -a, -a, a); if (S) rect(-a, a, a, 0.5); if (N) rect(-a, -0.5, a, -a);
    for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
      if (!con(sx, 0) || !con(0, sz)) continue;
      if (con(sx, sz)) { rect(Math.min(sx * a, sx * 0.5), Math.min(sz * a, sz * 0.5), Math.max(sx * a, sx * 0.5), Math.max(sz * a, sz * 0.5)); continue; }
      // inner (concave) corner: a little fillet so the junction reads as one poured path
      const f = t.m, cx = x + sx * a, cz = z + sz * a;
      const P = (u) => [x + sx * (a + f) - sx * f * Math.cos(u), y, z + sz * (a + f) - sz * f * Math.sin(u)];
      for (let j = 0; j < 6; j++) pushTri(b, [cx, y, cz], P(j / 6 * Math.PI / 2), P((j + 1) / 6 * Math.PI / 2), up);
    }
  }
}

    vec3 decN(vec4 s){ vec2 xy = s.xy*2.0-1.0; return vec3(xy, sqrt(max(0.0, 1.0-dot(xy,xy)))); }
    float edgeAt(vec2 uv, vec2 px){
      float d0 = texture2D(tDepth, uv).x; vec4 s0 = texture2D(tId, uv); vec3 n0 = decN(s0);
      float e = 0.0;
      for (int k = 0; k < 4; k++) {
        vec2 o = k==0 ? vec2(px.x,0.0) : k==1 ? vec2(-px.x,0.0) : k==2 ? vec2(0.0,px.y) : vec2(0.0,-px.y);
        float d = texture2D(tDepth, uv+o).x; vec4 s = texture2D(tId, uv+o);
        e = max(e, smoothstep(0.0012, 0.0024, abs(d-d0)));
        e = max(e, 1.0 - smoothstep(0.8, 0.9, dot(n0, decN(s))));
        e = max(e, step(0.5/255.0, abs(s.z-s0.z) + abs(s.w-s0.w)));
      }
      return e;
    }
    // 4 rotated-grid sub-samples: cheap anti-aliasing for the ink
    float edge(vec2 uv, float thick){
      vec2 px = thick * uPR * 0.5 / uRes;
      vec2 q = 0.5 / uRes;
      return 0.25 * (edgeAt(uv + vec2(q.x, 0.5*q.y), px) + edgeAt(uv + vec2(-0.5*q.x, q.y), px)
                   + edgeAt(uv + vec2(-q.x, -0.5*q.y), px) + edgeAt(uv + vec2(0.5*q.x, -q.y), px));
    }
    void main(){
      vec2 fc = gl_FragCoord.xy / uPR;     // css-pixel coords so grain/wobble don't depend on DPR
      // A steady pen: the line is STATIC by default. Irregularity is small (<= ~0.5 css px) and fairly
      // high-frequency along the stroke, plus a slow swell/thin of the line weight and ink density.
      // (Optional 'boil' re-rolls the noise twice a second.)
      float t = uBoil * floor(uTime * 2.0) * 17.31;
      vec2 w = vec2(n(fc * 0.21 + t), n(fc * 0.21 + 31.7 + t)) - 0.5;
      float weight = mix(1.0, 0.75 + 0.5 * n(fc * 0.03 + 11.0 + t), uWobble);
      float e = edge(vUv + w * uWobble * 1.0 * uPR / uRes, uThick * weight) * uInkOn;
      vec3 col = texture2D(tColor, vUv).rgb;
      float dens = mix(1.0, 0.8 + 0.2 * n(fc * 0.07 + 3.0 + t), uWobble);
      col = mix(col, uInk, clamp(e * 1.15, 0.0, 1.0) * dens);
      // Paper grain is applied AFTER the sRGB encode (it used to be a +/-1.6% multiply in linear space, which
      // the encode squashed to ~1 grey level, then the 2x->1x downsample averaged its finest octave away).
      vec4 o = linearToOutputTexel(vec4(col, 1.0));
      vec4 sid = texture2D(tId, vUv);
      float bg = 1.0 - step(0.5 / 255.0, sid.z + sid.w);             // empty paper vs. drawn objects
      float speck = h(floor(fc)) - 0.5;                                // per-css-pixel tooth
      float fibre = n(vec2(fc.x * 0.08 + fc.y * 0.03, fc.y * 0.9 - fc.x * 0.25)) - 0.5; // short elongated fibres
      float mott = (n(fc * 0.011) - 0.5) + 0.6 * (n(fc * 0.032 + 5.0) - 0.5);          // soft cloudy mottling
      float fleck = step(0.9965, h(floor(fc * 0.5) + 3.1));            // the odd darker fleck
      float grain = speck * 0.05 + fibre * 0.04 + mott * 0.05 - fleck * 0.06;
      o.rgb += uPaper * grain * mix(0.3, 1.0, bg);
      gl_FragColor = o;
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene();
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// per-mesh id materials
const inkMeshes = [];
let nextId = 1;
scene.traverse((o) => {
  if (!o.isMesh || o.userData.noInk) return;
  const id = nextId++;
  o.userData.idMat = new THREE.ShaderMaterial({
    uniforms: { uId: { value: new THREE.Vector2(Math.floor(id / 256) / 255, (id % 256) / 255) } },
    vertexShader: idVert, fragmentShader: idFrag, blending: THREE.NoBlending,
  });
  o.userData.mat = o.material;
  inkMeshes.push(o);
});
const noInk = [];
scene.traverse((o) => { if ((o.isMesh && o.userData.noInk) || o.isLineSegments) noInk.push(o); });

const FRUSTUM = 13.0;
function resize() {
  const w = innerWidth, h = innerHeight, pr = renderer.getPixelRatio();
  renderer.setSize(w, h);
  const a = w / h, fh = a < 1.5 ? FRUSTUM * 1.5 / a : FRUSTUM;
  camera.left = -fh * a / 2; camera.right = fh * a / 2; camera.top = fh / 2; camera.bottom = -fh / 2;
  camera.updateProjectionMatrix();
  colorRT.setSize(w * pr, h * pr); idRT.setSize(w * pr, h * pr);
  post.uniforms.uRes.value.set(w * pr, h * pr);
  post.uniforms.uPR.value = pr;
}
addEventListener('resize', resize); resize();

// camera presets (also handy for screenshots: window.spike.view('stack'))
const VIEWS = { hero: [[0, 0, 0], 1], rows: [[-3.3, 0.5, -0.7], 1.6], stack: [[3.3, 1.2, -1.0], 1.95], merge: [[3.5, 1.3, -1.3], 2.7], garden: [[-3.3, 0.3, 1.0], 2.4] };
function view(name) {
  const [t, z] = VIEWS[name]; const off = camera.position.clone().sub(controls.target);
  controls.target.set(...t); camera.position.copy(controls.target).add(off);
  camera.zoom = z; camera.updateProjectionMatrix();
}
window.spike = { view, camera, controls, renderer, scene };
document.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => view(b.dataset.v)));

const bind = (id, fn) => document.getElementById(id).addEventListener('change', (e) => fn(e.target.checked));
bind('ink', (v) => post.uniforms.uInkOn.value = v ? 1 : 0);
bind('wob', (v) => post.uniforms.uWobble.value = v ? 1 : 0);
bind('boil', (v) => post.uniforms.uBoil.value = v ? 1 : 0);
bind('paper', (v) => post.uniforms.uPaper.value = v ? 1 : 0);
bind('labels', (v) => document.getElementById('labelLayer').style.display = v ? '' : 'none');

// ---------------------------------------------------------------- animate
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
function tri(x) { x = x - Math.floor(x); return x < 0.5 ? x * 2 : 2 - x * 2; }
let fpsFrames = 0, fpsT = 0, fps = 0;
const statsEl = document.getElementById('stats');
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  for (const s of spinners) s.axis === 'y' ? (s.obj.rotation.y += dt * s.speed) : (s.obj.rotation.z -= dt * s.speed);
  for (const s of swayers) { s.obj.rotation.z = Math.sin(t * 1.3 + s.phase) * (s.amt ?? 0.04); s.obj.rotation.x = Math.sin(t * 0.9 + s.phase) * 0.025; }
  for (const l of glowers) l.material.uniforms.uEmissive.value = 0.7 + 0.3 * Math.sin(t * 3);
  for (const f of flags) f.segs.forEach((s, i) => s.rotation.y = Math.sin(t * 4 + f.phase - i * 0.9) * (0.25 + i * 0.08));
  for (const mb of magicBlocks) {
    mb.inner.position.y = H / 2 + 0.06 + Math.sin(t * 2) * 0.05;
    mb.star.rotation.y = t * 1.5;
    mb.star.position.y = Math.sin(t * 2.6) * 0.04;
    mb.foot.material.opacity = 0.35 + 0.15 * Math.sin(t * 2);
    mb.sparkles.forEach((s, i) => {
      const a = t * 0.9 + i * Math.PI * 2 / 6;
      s.position.set(Math.cos(a) * 0.62, 0.15 + ((t * 0.35 + i / 6) % 1) * 1.0, Math.sin(a) * 0.62);
      s.scale.setScalar(Math.max(0.05, Math.sin(((t * 0.35 + i / 6) % 1) * Math.PI)));
      s.rotation.y = t * 3;
    });
  }
  // smoke: puffs rise, drift with the wind, swell then shrink
  const period = 3.4;
  for (const p of puffs) {
    const age = ((t + p.i * period / 5 + p.seed) % period) / period;
    p.m.position.set(p.base.x + age * 0.3 + Math.sin(age * 6 + p.seed) * 0.04, p.base.y + age * 0.8, p.base.z - age * 0.15);
    p.m.scale.setScalar(Math.sin(Math.min(1, age * 1.3) * Math.PI) * (0.05 + age * 0.07) + 0.001);
  }
  // walkers: ping-pong along their route, legs and arms swing
  for (const w of walkers) {
    const u = t * w.speed / w.len + w.phase;
    const k = tri(u), forward = (u - Math.floor(u)) < 0.5;
    const x = w.a[0] + (w.b[0] - w.a[0]) * k, z = w.a[1] + (w.b[1] - w.a[1]) * k;
    const dx = (w.b[0] - w.a[0]) * (forward ? 1 : -1), dz = (w.b[1] - w.a[1]) * (forward ? 1 : -1);
    const y = w.yFn ? w.yFn(x, z) : G;
    w.g.position.set(x, y + Math.abs(Math.sin(t * 9 + w.phase * 10)) * 0.02, z);
    w.g.rotation.y = Math.atan2(dx, dz);
    const sw = Math.sin(t * 9 + w.phase * 10) * 0.55;
    w.legL.rotation.x = sw; w.legR.rotation.x = -sw; w.armL.rotation.x = -sw * 0.8; w.armR.rotation.x = sw * 0.8;
  }
  for (const p of idlers) {
    p.g.position.y = p.y + Math.max(0, Math.sin(t * 2 + p.phase)) * 0.008;
    p.g.rotation.y = p.ry + Math.sin(t * 0.5 + p.phase) * 0.5;
    p.armR.rotation.z = Math.max(0, Math.sin(t * 1.2 + p.phase * 2)) * 0.6; // little waves / gestures
  }
  // sailing boat: slow loop around the island, heading follows the tangent
  const bu = 1 - ((t * 0.006 + 0.62) % 1);
  const bp = boatLane.getPointAt(bu), bt = boatLane.getTangentAt(bu);
  theBoat.position.set(bp.x, 0.02 + Math.sin(t * 1.6) * 0.02, -bp.y);
  theBoat.rotation.set(0, Math.atan2(bt.y, -bt.x), Math.sin(t * 1.3) * 0.06);
  theRowboat.position.y = 0.02 + Math.sin(t * 1.9) * 0.015; theRowboat.rotation.z = Math.sin(t * 1.4) * 0.04;
  gulls.forEach((gg, i) => {
    const a = t * 0.35 + i * 2.1;
    gg.g.position.set(0.5 + Math.cos(a) * (3 + i), 3.6 + i * 0.3 + Math.sin(t * 0.8 + i) * 0.15, -0.3 + Math.sin(a) * (2 + i * 0.6));
    gg.g.rotation.y = -a - Math.PI / 2;   // face along the direction of flight
    const flap = Math.sin(t * 8 + i * 2) * 0.5;
    gg.wl.rotation.x = -0.35 + flap; gg.wr.rotation.x = 0.35 - flap;
  });
  water.material.uniforms.uTime.value = t;
  post.uniforms.uTime.value = t;

  controls.update();
  renderer.info.reset();

  // pass 1: color + depth
  renderer.setRenderTarget(colorRT);
  renderer.setClearColor(C.paper, 1);
  renderer.render(scene, camera);
  // pass 2: ids + view normals (opaque meshes only)
  for (const m of inkMeshes) m.material = m.userData.idMat;
  for (const o of noInk) o.visible = false;
  renderer.setRenderTarget(idRT);
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, camera);
  for (const m of inkMeshes) m.material = m.userData.mat;
  for (const o of noInk) o.visible = true;
  // pass 3: composite with ink
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);

  // labels
  for (const l of labels) {
    tmp.copy(l.p).project(camera);
    l.el.style.left = ((tmp.x + 1) / 2 * innerWidth) + 'px';
    l.el.style.top = ((1 - tmp.y) / 2 * innerHeight) + 'px';
  }
  fpsFrames++; fpsT += dt;
  if (fpsT > 0.5) {
    fps = fpsFrames / fpsT; fpsFrames = 0; fpsT = 0;
    statsEl.textContent = `${fps.toFixed(0)} fps · ${inkMeshes.length} meshes · ${renderer.info.render.calls} draw calls/frame (3 passes)`;
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
