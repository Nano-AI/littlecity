<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Little City gallery</title>
    <link rel="stylesheet" href="/src/ui/ui.css" />
    <style>
      html, body { margin: 0; background: #f2ede3; color: #3a2f2a; font: 500 13px/1.4 var(--lc-font); }
      h1 { font-size: 16px; margin: 0 0 8px; }
      h2 { font-size: 15px; margin: 0; }
      h3 { font-size: 12px; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }

      /* The viewer fills the window: list, stage, sliders. The registry tables follow below. */
      .g-viewer { display: grid; grid-template-columns: 230px minmax(0, 1fr) 310px; height: 100vh; }
      .g-side { display: flex; flex-direction: column; min-height: 0; padding: 12px 8px 0 12px; border-right: 1.6px solid var(--lc-ink); background: var(--lc-card); }
      .g-filter { font: inherit; padding: 6px 9px; border: 1.5px solid var(--lc-ink); border-radius: 10px 8px 11px 7px / 8px 11px 7px 10px; background: #fff; color: inherit; }
      .g-list { overflow-y: auto; flex: 1; padding: 0 4px 16px 0; margin-top: 4px; }
      .g-list section[hidden], .g-entry[hidden] { display: none; }
      .g-entry { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%; box-sizing: border-box; padding: 3px 8px; margin: 1px 0;
        font: inherit; font-weight: 600; text-align: left; color: inherit; background: none; border: 1.5px solid transparent; border-radius: 9px 7px 10px 6px / 7px 10px 6px 9px; cursor: pointer; }
      .g-entry:hover { background: var(--lc-soft); }
      .g-entry[aria-current='true'] { background: color-mix(in srgb, var(--lc-pick) 58%, white); border-color: var(--lc-ink); }
      .g-entry small { font-weight: 500; font-size: 10.5px; opacity: 0.65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .g-stage { position: relative; min-width: 0; overflow: hidden; }
      .g-canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      .g-canvas[hidden], .g-icons[hidden], .g-buttons[hidden] { display: none; }
      .g-head { position: absolute; left: 12px; top: 12px; max-width: min(560px, calc(100% - 24px)); padding: 9px 12px; box-sizing: border-box; }
      .g-about { margin: 3px 0 7px; font-size: 12px; opacity: 0.85; }
      .g-bars { display: flex; flex-wrap: wrap; gap: 6px 14px; }
      .g-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
      .g-small { min-height: 26px; padding: 2px 9px; font-size: 12px; }
      .g-small[aria-pressed='true'] { background: color-mix(in srgb, var(--lc-pick) 58%, white); }
      .g-stats { margin-top: 6px; font-size: 11px; opacity: 0.7; font-variant-numeric: tabular-nums; }

      .g-tuning { position: static; width: auto; height: 100vh; border-radius: 0; border-width: 0 0 0 1.6px; box-shadow: none; min-height: 0; }

      .g-icons { position: absolute; inset: 0; overflow: auto; padding: 120px 20px 20px; display: grid; grid-template-columns: repeat(auto-fill, 104px); gap: 12px; align-content: start; background: #b9dc94; }
      .g-icons figure { margin: 0; padding: 8px 4px 6px; display: grid; grid-template-columns: 1fr auto; align-items: end; justify-items: center; gap: 4px;
        background: var(--lc-card); border: 1.6px solid var(--lc-ink); border-radius: 13px 11px 14px 10px / 11px 14px 10px 13px; }
      .g-icon-big { width: 64px; height: 64px; }
      .g-icon-small { width: 26px; height: 26px; }
      .g-icons figcaption { grid-column: 1 / 3; font-size: 11px; font-weight: 600; }

      .g-registry { padding: 20px 24px 60px; }
      .g-registry table { border-collapse: collapse; }
      .g-registry td { padding: 2px 14px 2px 0; text-align: left; vertical-align: top; }

      @media (max-width: 900px) {
        .g-viewer { grid-template-columns: 170px minmax(0, 1fr); }
        .g-tuning { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="gallery"></div>
    <script type="module" src="/gallery/main.ts"></script>
  </body>
</html>
